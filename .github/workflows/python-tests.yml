name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Smoke test installed CLI
        run: |
          repo-health --help
          repo-health --json .

  coverage:
    name: Test coverage (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coverage tool
        run: python -m pip install 'coverage>=7,<8'
      - name: Run tests with coverage
        run: python -m coverage run --source=audit -m unittest discover -v
      - name: Print coverage report
        run: python -m coverage report -m --fail-under=100
      - name: Generate XML coverage report
        run: python -m coverage xml -o coverage.xml
      - name: Generate sample HTML report
        run: python generate_sample_html.py
      - name: Upload sample HTML report
        uses: actions/upload-artifact@v4
        with:
          name: repo-health-sample-html-report
          path: examples/sample-report.html
          if-no-files-found: error
      - name: Upload sample JSON report
        uses: actions/upload-artifact@v4
        with:
          name: repo-health-sample-report
          path: examples/sample-report.json
          if-no-files-found: error
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-xml
          path: coverage.xml
          if-no-files-found: error
